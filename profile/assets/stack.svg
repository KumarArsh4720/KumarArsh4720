  <text x="34" y="120.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1.6" fill="#6E5C49">BACKEND · DATA</text>
