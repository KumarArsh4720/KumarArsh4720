  <g class="chip c2"><rect x="399.6" y="46" width="72.5" height="32" rx="10" fill="#241A13" stroke="#E8A65D" stroke-opacity=".28"/><text x="435.9" y="66.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#EDE3D6">HTML5</text></g>
