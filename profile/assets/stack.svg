    <g class="fl f5"><g class="sw s5"><g transform="scale(0.941)" opacity="0.40"><path d="M6 0C9.7 3.3 12 6.6 6 14 0 6.6 2.3 3.3 6 0Z" fill="#E8A65D"/><path d="M6 1.8V12.2" stroke="#17110C" stroke-opacity=".45" stroke-width=".8"/></g></g></g>
