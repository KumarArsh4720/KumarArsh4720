<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="224"
     viewBox="0 0 1000 224" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1000" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17110C"/>
      <stop offset=".55" stop-color="#1F1710"/>
      <stop offset="1" stop-color="#271C13"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2D7A7"/>
      <stop offset="1" stop-color="#E8A65D"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8A65D" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E8A65D" stop-opacity=".75"/>
      <stop offset="1" stop-color="#E8A65D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#E8A65D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#E8A65D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#D4785A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D4785A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#E8A65D" fill-opacity=".07"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="224" rx="18"/></clipPath>
    <style>
    .lampA{animation:driftA 19s ease-in-out infinite}
    .lampB{animation:driftB 23s ease-in-out infinite}
    @keyframes driftA{0%,100%{opacity:.85;transform:translate(0,0)}50%{opacity:1;transform:translate(26px,10px)}}
    @keyframes driftB{0%,100%{opacity:.8;transform:translate(0,0)}50%{opacity:1;transform:translate(-22px,-8px)}}
    .hud{animation:breathe 6s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.9}50%{opacity:.55}}.f0{animation:fall0 19.25s linear -9.23s infinite}@keyframes fall0{from{transform:translate(141.5px,-30px)}to{transform:translate(168.1px,254px)}}.s0{animation:sway0 3.16s ease-in-out -9.23s infinite alternate}@keyframes sway0{from{transform:translateX(-9.7px) rotate(8deg)}to{transform:translateX(9.7px) rotate(105deg)}}.f1{animation:fall1 16.57s linear -2.40s infinite}@keyframes fall1{from{transform:translate(-15.3px,-30px)}to{transform:translate(45.3px,254px)}}.s1{animation:sway1 4.55s ease-in-out -2.40s infinite alternate}@keyframes sway1{from{transform:translateX(-10.5px) rotate(2deg)}to{transform:translateX(10.5px) rotate(90deg)}}.f2{animation:fall2 15.28s linear -7.60s infinite}@keyframes fall2{from{transform:translate(610.5px,-30px)}to{transform:translate(545.3px,254px)}}.s2{animation:sway2 2.90s ease-in-out -7.60s infinite alternate}@keyframes sway2{from{transform:translateX(-10.7px) rotate(-18deg)}to{transform:translateX(10.7px) rotate(39deg)}}.f3{animation:fall3 15.46s linear -7.49s infinite}@keyframes fall3{from{transform:translate(441.3px,-30px)}to{transform:translate(448.5px,254px)}}.s3{animation:sway3 3.09s ease-in-out -7.49s infinite alternate}@keyframes sway3{from{transform:translateX(-4.7px) rotate(12deg)}to{transform:translateX(4.7px) rotate(78deg)}}.f4{animation:fall4 18.55s linear -13.54s infinite}@keyframes fall4{from{transform:translate(755.0px,-30px)}to{transform:translate(791.8px,254px)}}.s4{animation:sway4 2.92s ease-in-out -13.54s infinite alternate}@keyframes sway4{from{transform:translateX(-7.6px) rotate(10deg)}to{transform:translateX(7.6px) rotate(72deg)}}.f5{animation:fall5 17.52s linear -5.57s infinite}@keyframes fall5{from{transform:translate(273.7px,-30px)}to{transform:translate(337.3px,254px)}}.s5{animation:sway5 3.86s ease-in-out -5.57s infinite alternate}@keyframes sway5{from{transform:translateX(-6.2px) rotate(10deg)}to{transform:translateX(6.2px) rotate(68deg)}}.f6{animation:fall6 20.73s linear -4.60s infinite}@keyframes fall6{from{transform:translate(481.2px,-30px)}to{transform:translate(488.3px,254px)}}.s6{animation:sway6 4.18s ease-in-out -4.60s infinite alternate}@keyframes sway6{from{transform:translateX(-8.1px) rotate(-3deg)}to{transform:translateX(8.1px) rotate(57deg)}}.f7{animation:fall7 14.99s linear -1.55s infinite}@keyframes fall7{from{transform:translate(330.5px,-30px)}to{transform:translate(344.1px,254px)}}.s7{animation:sway7 2.77s ease-in-out -1.55s infinite alternate}@keyframes sway7{from{transform:translateX(-9.8px) rotate(7deg)}to{transform:translateX(9.8px) rotate(88deg)}}.f8{animation:fall8 23.86s linear -22.94s infinite}@keyframes fall8{from{transform:translate(966.6px,-30px)}to{transform:translate(953.6px,254px)}}.s8{animation:sway8 4.14s ease-in-out -22.94s infinite alternate}@keyframes sway8{from{transform:translateX(-10.2px) rotate(-11deg)}to{transform:translateX(10.2px) rotate(71deg)}}
    .chip{opacity:0;animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
    .ttl{animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
    @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .c0{animation-delay:0.00s}.c1{animation-delay:0.06s}.c2{animation-delay:0.12s}.c3{animation-delay:0.18s}.c4{animation-delay:0.24s}.c5{animation-delay:0.30s}.c6{animation-delay:0.36s}.c7{animation-delay:0.42s}.c8{animation-delay:0.48s}.c9{animation-delay:0.54s}.c10{animation-delay:0.60s}.c11{animation-delay:0.66s}.c12{animation-delay:0.72s}
    @media(prefers-reduced-motion:reduce){
      .lampA,.lampB,.hud,.fl,.sw,.dot,.name,.sub,.bar,.chip,.ttl{animation:none}
      .chip,.ttl{opacity:1}
    }
    </style>
  </defs>

