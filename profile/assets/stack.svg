    <g class="fl f7"><g class="sw s7"><g transform="scale(0.925)" opacity="0.33"><path d="M6 0C9.7 3.3 12 6.6 6 14 0 6.6 2.3 3.3 6 0Z" fill="#A88A52"/><path d="M6 1.8V12.2" stroke="#17110C" stroke-opacity=".45" stroke-width=".8"/></g></g></g>
    <g class="fl f8"><g class="sw s8"><g transform="scale(0.707)" opacity="0.37"><path d="M6 0C9.7 3.3 12 6.6 6 14 0 6.6 2.3 3.3 6 0Z" fill="#D4785A"/><path d="M6 1.8V12.2" stroke="#17110C" stroke-opacity=".45" stroke-width=".8"/></g></g></g>
  </g>
  <rect x=".9" y=".9" width="998.2" height="222.2" rx="17.1" fill="none" stroke="#E8A65D" stroke-opacity=".20"/>
  <g class="hud">
    <path d="M14 32V14H32" fill="none" stroke="#E8A65D" stroke-opacity=".38" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M968 14H986V32" fill="none" stroke="#E8A65D" stroke-opacity=".38" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M986 192V210H968" fill="none" stroke="#E8A65D" stroke-opacity=".38" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M32 210H14V192" fill="none" stroke="#E8A65D" stroke-opacity=".38" stroke-width="1.3" stroke-linecap="round"/>
  </g>

