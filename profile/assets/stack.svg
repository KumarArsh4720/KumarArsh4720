  <g class="chip c9"><rect x="184.0" y="154" width="56.3" height="32" rx="10" fill="#241A13" stroke="#E8A65D" stroke-opacity=".28"/><text x="212.2" y="174.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#EDE3D6">Git</text></g>
