  <g class="chip c7"><rect x="483.1" y="100" width="72.5" height="32" rx="10" fill="#241A13" stroke="#E8A65D" stroke-opacity=".28"/><text x="519.3" y="120.8" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" fill="#EDE3D6">NumPy</text></g>
