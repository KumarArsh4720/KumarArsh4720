    <ellipse class="lampB" cx="820" cy="206" rx="340" ry="179" fill="url(#ember)"/>
    <g class="fl f0"><g class="sw s0"><g transform="scale(0.836)" opacity="0.23"><path d="M6 0C9.7 3.3 12 6.6 6 14 0 6.6 2.3 3.3 6 0Z" fill="#E8A65D"/><path d="M6 1.8V12.2" stroke="#17110C" stroke-opacity=".45" stroke-width=".8"/></g></g></g>
