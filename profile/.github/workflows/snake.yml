name: Snake contribution animation

on:
  schedule:
    - cron: "0 */12 * * *"    # regenerate twice a day
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake variants
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/autumn.svg?color_snake=%23E8A65D&color_dots=%2317110C,%234A3320,%238A5A2E,%23C1813F,%23E8A65D
            dist/ember.svg?color_snake=%23E8663D&color_dots=%2317110C,%233D1F17,%237A3521,%23B8502E,%23E8663D
            dist/sand.svg?color_snake=%23F2D7A7&color_dots=%2317110C,%233A3225,%236E6045,%23AC9769,%23F2D7A7
            dist/clay.svg?color_snake=%23D4785A&color_dots=%2317110C,%23402A22,%23764539,%23AE6250,%23D4785A
            dist/github-snake.svg
            dist/autumn.gif?color_snake=%23E8A65D&color_dots=%231F1710,%234A3320,%238A5A2E,%23C1813F,%23E8A65D&color_background=%2317110C

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
